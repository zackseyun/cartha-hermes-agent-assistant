<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartha Hermes Local</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail">
        <div class="brand">
          <div class="brand-mark">⚕</div>
          <div>
            <div class="eyebrow">Cartha Local</div>
            <h1>Hermes</h1>
          </div>
        </div>
        <div class="status-card">
          <div class="status-row">
            <span id="status-dot" class="dot dot-warn"></span>
            <span id="status-text">Checking Hermes…</span>
          </div>
          <div id="status-detail" class="muted">Gemma 4 31B via Ollama</div>
        </div>
        <div class="quick-actions">
          <button data-prompt="What is the current health of this Mac? Use safe read-only commands only.">System check</button>
          <button data-prompt="Summarize the current GitHub workspace. Start with folders and likely active repos.">Workspace map</button>
          <button data-prompt="Describe this local Gemma 4 31B + Hermes setup and what it can safely do.">Harness overview</button>
        </div>
        <div class="settings-card">
          <label>
            System prompt
            <textarea id="system-prompt" rows="8">You are Quinn, Zack's local operator powered by Gemma 4 31B. Be concise, practical, and careful. Prefer read-only inspection before changing anything. Ask before destructive actions.</textarea>
          </label>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="topbar">
          <div>
            <div class="eyebrow">Powered by local Gemma 4 31B + Hermes harness</div>
            <h2>Local Operator Console</h2>
          </div>
          <div class="top-actions">
            <button id="refresh-status">Refresh</button>
            <button id="clear-chat" class="ghost">Clear</button>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="Ask Gemma 4 31B to inspect, reason, or describe an attached image…"></textarea>
          <div class="attachment-row">
            <label class="file-picker">
              <span>Attach image</span>
              <input id="attachments" type="file" accept="image/*" multiple />
            </label>
            <div id="attachment-preview" class="attachment-preview muted">Vision is enabled. Audio needs E4B or transcription.</div>
          </div>
          <div class="backend-row">
            <label class="inline-toggle"><input id="backend-ollama" type="radio" name="backend" value="ollama" checked /> Fast Gemma chat</label>
            <label class="inline-toggle"><input id="backend-openrouter" type="radio" name="backend" value="openrouter" /> DeepSeek V4 Flash</label>
            <label class="inline-toggle"><input id="backend-hermes" type="radio" name="backend" value="hermes" /> Hermes agent mode</label>
          </div>
          <div class="composer-footer">
            <div id="stream-status" class="muted">Ready</div>
            <button id="stop" type="button" class="ghost" disabled>Stop</button>
            <button id="send" type="submit">Send</button>
          </div>
        </form>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
